<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" role="img" aria-label="Install Convo Caddy. Drag to Applications. Remove Convo Caddy: open the uninstaller below.">
  <rect width="560" height="400" fill="#F3F5F1"/>
  <g font-family="Instrument Sans" fill="#111815">
    <text x="36" y="43" font-size="22" font-weight="600" letter-spacing="-.6">Convo Caddy</text>
    <text x="36" y="68" font-size="14" fill="#5F6A65">Drag Convo Caddy to Applications to install.</text>
    <text x="524" y="42" text-anchor="end" font-size="12" font-weight="600" fill="#5A603D">Frameyard</text>
    <path d="M250 150h60m-10-10 10 10-10 10" fill="none" stroke="#2E7158" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 234h488" stroke="#D7DED9"/>
    <text x="264" y="291" font-size="17" font-weight="600">Remove Convo Caddy</text>
    <text x="264" y="316" font-size="13" fill="#5F6A65">Open the uninstaller on the left.</text>
    <text x="264" y="337" font-size="13" fill="#5F6A65">Your workspace is kept by default.</text>
    <text x="36" y="382" font-size="12" fill="#5F6A65">After installing, eject this disk and open Convo Caddy in Applications.</text>
  </g>
</svg>
